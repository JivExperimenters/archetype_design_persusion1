<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Responsive hero wireframes</title><desc id="desc">A desktop split layout becomes a mobile stack, preserving readable copy and a usable action.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#b84223"/></marker></defs><rect width="1200" height="700" fill="#f6f3eb"/><g font-family="Arial, Helvetica, sans-serif" fill="#152d38"><text x="48" y="55" font-size="36" font-weight="700" fill="#152d38">Recompose for the screen</text><text x="48" y="95" font-size="23" font-weight="400" fill="#152d38">Preserve meaning and hierarchy. Do not shrink the whole desktop mockup.</text><text x="50" y="150" font-size="22" font-weight="700" fill="#152d38">DESKTOP</text><rect x="48" y="176" width="658" height="390" rx="12" fill="#ffffff" stroke="#c7d3d0" stroke-width="2"/><text x="76" y="222" font-size="18" font-weight="700" fill="#152d38">FIRST DETOUR</text><text x="76" y="287" font-size="31" font-weight="700" fill="#152d38">Benefit headline</text><text x="76" y="330" font-size="24" font-weight="400" fill="#152d38">Explain the offer.</text><rect x="76" y="363" width="267" height="62" rx="6" fill="#194f3c" stroke="#194f3c" stroke-width="2"/><text x="96" y="402" font-size="24" font-weight="700" fill="#fff">Get the free map</text><text x="76" y="466" font-size="20" font-weight="400" fill="#152d38">What happens next</text><rect x="384" y="218" width="283" height="300" rx="12" fill="#e3ebe7" stroke="#adc4bb" stroke-width="2"/><text x="428" y="355" font-size="22" font-weight="700" fill="#152d38">Image / subject</text><path d="M729 353 L802 353" fill="none" stroke="#b84223" stroke-width="4" marker-end="url(#arrow)"/><text x="845" y="150" font-size="22" font-weight="700" fill="#152d38">MOBILE</text><rect x="833" y="176" width="318" height="456" rx="12" fill="#ffffff" stroke="#c7d3d0" stroke-width="2"/><text x="854" y="216" font-size="18" font-weight="700" fill="#152d38">FIRST DETOUR</text><text x="854" y="266" font-size="27" font-weight="700" fill="#152d38">Benefit headline</text><text x="854" y="305" font-size="22" font-weight="400" fill="#152d38">Explain the offer.</text><rect x="853" y="328" width="278" height="58" rx="6" fill="#194f3c" stroke="#194f3c" stroke-width="2"/><text x="880" y="366" font-size="24" font-weight="700" fill="#fff">Get the free map</text><text x="854" y="416" font-size="20" font-weight="400" fill="#152d38">What happens next</text><rect x="853" y="442" width="278" height="167" rx="12" fill="#e3ebe7" stroke="#adc4bb" stroke-width="2"/><text x="883" y="526" font-size="23" font-weight="700" fill="#152d38">Purposeful crop</text><text x="48" y="655" font-size="23" font-weight="700" fill="#152d38">This is one mobile order to try. Recheck the crop, type size, and CTA for your own brief.</text></g></svg>
