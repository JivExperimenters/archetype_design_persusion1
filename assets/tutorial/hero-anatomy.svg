<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Anatomy of a hero</title><desc id="desc">A numbered wireframe connects context, benefit, offer, action, and imagery.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#b84223"/></marker></defs><rect width="1200" height="700" fill="#f6f3eb"/><g font-family="Arial, Helvetica, sans-serif" fill="#152d38"><text x="48" y="55" font-size="36" font-weight="700" fill="#152d38">Give every element a job</text><text x="48" y="92" font-size="21" font-weight="400" fill="#152d38">A wireframe for FIRST DETOUR — one useful layout, not a required reading path.</text><rect x="48" y="125" width="1104" height="480" rx="12" fill="#ffffff" stroke="#c7d3d0" stroke-width="2"/><text x="80" y="172" font-size="20" font-weight="700" fill="#152d38">FIRST DETOUR</text><text x="80" y="214" font-size="18" font-weight="700" fill="#b84223">1  CONTEXT</text><text x="80" y="247" font-size="23" font-weight="400" fill="#152d38">A small adventure starts here</text><text x="80" y="295" font-size="18" font-weight="700" fill="#b84223">2  BENEFIT</text><text x="80" y="338" font-size="40" font-weight="700" fill="#152d38">Find a new way</text><text x="80" y="384" font-size="40" font-weight="700" fill="#152d38">through your city.</text><text x="80" y="427" font-size="18" font-weight="700" fill="#b84223">3  OFFER</text><text x="80" y="461" font-size="23" font-weight="400" fill="#152d38">A free neighborhood walking map.</text><rect x="80" y="487" width="375" height="61" rx="7" fill="#194f3c" stroke="#194f3c" stroke-width="2"/><text x="104" y="527" font-size="27" font-weight="700" fill="#ffffff">4  Get the free map</text><text x="80" y="580" font-size="20" font-weight="400" fill="#152d38">PDF download. No email required.</text><rect x="666" y="170" width="436" height="382" rx="12" fill="#e3ebe7" stroke="#adc4bb" stroke-width="2"/><text x="695" y="212" font-size="20" font-weight="700" fill="#152d38">5  PURPOSEFUL IMAGE</text><text x="695" y="252" font-size="24" font-weight="400" fill="#152d38">Show the experience or</text><text x="695" y="286" font-size="24" font-weight="400" fill="#152d38">what the visitor receives.</text><path d="M760 320 l65 18 65 -18 65 18 v145 l-65 -18 -65 18 -65 -18z" fill="#faf9f3" stroke="#194f3c" stroke-width="3"/><path d="M825 338 v145 M890 320 v145 M778 444 Q810 356 862 420 T940 360" fill="none" stroke="#b84223" stroke-width="4"/><text x="48" y="655" font-size="23" font-weight="700" fill="#152d38">Message → supporting image → clear next step. Keep the offer understandable without the picture.</text></g></svg>
