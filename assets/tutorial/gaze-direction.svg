<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">Gaze direction as a design hypothesis</title><desc id="desc">Three schematic faces look directly at the viewer, inward to an offer, or outward away from it.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#b84223"/></marker></defs><rect width="1200" height="670" fill="#f6f3eb"/><g font-family="Arial, Helvetica, sans-serif" fill="#152d38"><text x="48" y="55" font-size="36" font-weight="700" fill="#152d38">Where does the subject look?</text><text x="48" y="94" font-size="23" font-weight="400" fill="#152d38">These arrows are composition cues, not measured eye movements.</text><rect x="40" y="130" width="365" height="430" rx="12" fill="#ffffff" stroke="#c7d3d0" stroke-width="2"/><text x="62" y="176" font-size="24" font-weight="700" fill="#152d38">01  Direct gaze</text><rect x="60" y="267" width="134" height="78" rx="6" fill="#194f3c" stroke="#194f3c" stroke-width="2"/><text x="80" y="313" font-size="21" font-weight="700" fill="#fff">OFFER</text><circle cx="292" cy="291" r="65" fill="#e8c6a6" stroke="#152d38" stroke-width="3"/><ellipse cx="270" cy="280" rx="13" ry="10" fill="#fff"/><ellipse cx="314" cy="280" rx="13" ry="10" fill="#fff"/><circle cx="270" cy="280" r="6" fill="#152d38"/><circle cx="314" cy="280" r="6" fill="#152d38"/><path d="M271 316 Q292 331 313 316" fill="none" stroke="#152d38" stroke-width="3"/><path d="M292 366 L292 414" fill="none" stroke="#b84223" stroke-width="4" marker-end="url(#arrow)"/><text x="62" y="456" font-size="21" font-weight="700" fill="#152d38">Addresses the viewer.</text><text x="62" y="493" font-size="19" font-weight="400" fill="#152d38">May hold attention on the face.</text><rect x="430" y="130" width="365" height="430" rx="12" fill="#ffffff" stroke="#c7d3d0" stroke-width="2"/><text x="452" y="176" font-size="24" font-weight="700" fill="#152d38">02  Toward the offer</text><rect x="450" y="267" width="134" height="78" rx="6" fill="#194f3c" stroke="#194f3c" stroke-width="2"/><text x="470" y="313" font-size="21" font-weight="700" fill="#fff">OFFER</text><circle cx="682" cy="291" r="65" fill="#e8c6a6" stroke="#152d38" stroke-width="3"/><ellipse cx="660" cy="280" rx="13" ry="10" fill="#fff"/><ellipse cx="704" cy="280" rx="13" ry="10" fill="#fff"/><circle cx="654" cy="280" r="6" fill="#152d38"/><circle cx="698" cy="280" r="6" fill="#152d38"/><path d="M661 316 Q682 331 703 316" fill="none" stroke="#152d38" stroke-width="3"/><path d="M651 240 L523 240" fill="none" stroke="#b84223" stroke-width="4" marker-end="url(#arrow)"/><text x="452" y="456" font-size="21" font-weight="700" fill="#152d38">Orients toward the copy.</text><text x="452" y="493" font-size="19" font-weight="400" fill="#152d38">Test whether the offer is clearer.</text><rect x="820" y="130" width="365" height="430" rx="12" fill="#ffffff" stroke="#c7d3d0" stroke-width="2"/><text x="842" y="176" font-size="24" font-weight="700" fill="#152d38">03  Away from the offer</text><rect x="840" y="267" width="134" height="78" rx="6" fill="#194f3c" stroke="#194f3c" stroke-width="2"/><text x="860" y="313" font-size="21" font-weight="700" fill="#fff">OFFER</text><circle cx="1072" cy="291" r="65" fill="#e8c6a6" stroke="#152d38" stroke-width="3"/><ellipse cx="1050" cy="280" rx="13" ry="10" fill="#fff"/><ellipse cx="1094" cy="280" rx="13" ry="10" fill="#fff"/><circle cx="1056" cy="280" r="6" fill="#152d38"/><circle cx="1100" cy="280" r="6" fill="#152d38"/><path d="M1051 316 Q1072 331 1093 316" fill="none" stroke="#152d38" stroke-width="3"/><path d="M1096 240 L1165 240" fill="none" stroke="#b84223" stroke-width="4" marker-end="url(#arrow)"/><text x="842" y="456" font-size="21" font-weight="700" fill="#152d38">Suggests something beyond.</text><text x="842" y="493" font-size="19" font-weight="400" fill="#152d38">Check that the offer is noticed.</text><text x="48" y="615" font-size="23" font-weight="700" fill="#152d38">Choose based on the message. A face is optional; a relevant object may explain the offer better.</text></g></svg>
