<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" role="img" aria-labelledby="title desc">
  <title id="title">Swiss-style authority hero grid</title>
  <desc id="desc">An original wireframe showing a clear headline, expert identity and credential, evidence panel, source link, and CTA arranged in an aligned grid.</desc>
  <rect width="850" height="430" fill="#f1f4f7"/>
  <rect x="24" y="24" width="802" height="382" fill="#fff" stroke="#c5d0dc" stroke-width="1"/>
  <rect x="24" y="24" width="802" height="28" fill="#172b45"/>
  <text x="42" y="43" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">01 — SOURCE / EXPERTISE / EVIDENCE</text>
  <g stroke="#d8e0e8" stroke-width="1" stroke-dasharray="4 6">
    <line x1="54" y1="68" x2="54" y2="392"/>
    <line x1="170" y1="68" x2="170" y2="392"/>
    <line x1="286" y1="68" x2="286" y2="392"/>
    <line x1="402" y1="68" x2="402" y2="392"/>
    <line x1="518" y1="68" x2="518" y2="392"/>
    <line x1="634" y1="68" x2="634" y2="392"/>
    <line x1="750" y1="68" x2="750" y2="392"/>
    <line x1="54" y1="170" x2="796" y2="170"/>
    <line x1="54" y1="337" x2="796" y2="337"/>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="54" y="99" fill="#315b83" font-size="13" font-weight="700" letter-spacing="1.5">A QUESTION WITH A TRACEABLE ANSWER</text>
    <text x="54" y="145" fill="#172b45" font-size="31" font-weight="700">What does the evidence show?</text>
    <line x1="54" y1="170" x2="796" y2="170" stroke="#172b45" stroke-width="2"/>
    <rect x="54" y="195" width="300" height="132" rx="8" fill="#edf2f6"/>
    <rect x="54" y="195" width="5" height="132" fill="#315b83"/>
    <text x="74" y="220" fill="#315b83" font-size="11" font-weight="700" letter-spacing="1">EXPERT</text>
    <text x="74" y="250" fill="#172b45" font-size="17" font-weight="700">[Expert name]</text>
    <text x="74" y="274" fill="#315b83" font-size="13">[Relevant credential]</text>
    <text x="74" y="303" fill="#425568" font-size="12">[Verified role / organization]</text>
    <rect x="382" y="195" width="414" height="132" rx="8" fill="#edf4f1"/>
    <rect x="382" y="195" width="5" height="132" fill="#28665d"/>
    <text x="402" y="220" fill="#28665d" font-size="12" font-weight="700" letter-spacing="1">EVIDENCE SUMMARY</text>
    <text x="402" y="250" fill="#263640" font-size="14">[Finding, study or method]</text>
    <text x="402" y="274" fill="#263640" font-size="14">[Date, scope and important limitation]</text>
    <text x="402" y="306" fill="#315b83" font-size="13" font-weight="700">[Open original source →]</text>
    <rect x="54" y="350" width="742" height="34" fill="#f7f3e9"/>
    <text x="70" y="372" fill="#705522" font-size="12" font-weight="700">DISCLOSURE: [State sponsorship, payment, or other material connection when applicable.]</text>
  </g>
</svg>
